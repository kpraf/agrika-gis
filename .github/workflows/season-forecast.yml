# Objective 1 + 3: the season forecast of the faithful CNN-LSTM model.
#
# Every Monday at 06:00 Philippine time (after the data pipeline) this:
#   1. rebuilds the growth-phase picture features and the monthly weather from the
#      production database (a fresh runner has none of the pictures);
#   2. fetches the NDVI and Sentinel-1 pictures of any growth phase that has ended and
#      is not stored yet, computes their ResNet50 features and stores them;
#   3. forecasts the latest season whose third growth phase has ended (March 15 for the
#      dry season, September 15 for the wet season), for the cities and the barangays.
# A season already forecast is redone only when more reported seasons exist than when it
# was last forecast, so yields uploaded in the app are used for the next forecast
# (retraining). Otherwise the run finishes with nothing to do. Every forecast is logged
# in the forecast_runs table.
#
# It can also be started by hand: Actions tab -> Season forecast -> Run workflow.
#
# Uses the same repository secrets as the data pipeline:
#   CDSE_CLIENT_ID, CDSE_CLIENT_SECRET   Copernicus Data Space OAuth client
#   PIPELINE_DATABASE_URL                 the production (Supabase) connection string
name: Season forecast

on:
  schedule:
    - cron: "0 22 * * 0" # Sunday 22:00 UTC = Monday 06:00 in the Philippines (UTC+8)
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "Do not fetch new pictures (uses no Copernicus units)"
        required: false
        type: boolean
        default: false
      force:
        description: "Forecast the latest season again even if nothing new was reported"
        required: false
        type: boolean
        default: false

# The job only reads the repository; it cannot push, comment or change settings.
permissions:
  contents: read

# Shares the data pipeline's lock: the two never write to the database at the same time.
concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  forecast:
    name: Pictures, retrain, forecast
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Third-party actions are pinned to an exact commit, not a movable tag.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-pipeline.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-pipeline.txt pillow
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Check the secrets are present
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: |
          missing=0
          for name in CDSE_CLIENT_ID CDSE_CLIENT_SECRET DATABASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret for $name is not set (see the comment at the top of this workflow)."
              missing=1
            fi
          done
          exit $missing

      - name: Forecast
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          SKIP_FETCH: ${{ inputs.skip_fetch }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          # The API code refuses to load without a token-signing secret. This job issues
          # no tokens, so it gets a random one that lives only for this run.
          export JWT_SECRET_KEY="$(openssl rand -hex 32)"
          python backend/scripts/phase_pictures_stage.py --export
          if [ ! -f backend/db/previous_study/image_features_s1.npz ]; then
            echo "::error::No picture features in the database yet. Load them once with" \
                 "phase_pictures_stage.py --load from the computer that has the pictures."
            exit 1
          fi
          if [ "${SKIP_FETCH:-false}" != "true" ]; then
            python backend/scripts/phase_pictures_stage.py --fetch --max-pu 300
            python backend/scripts/phase_pictures_stage.py --load
          fi
          args=(--auto)
          if [ "${FORCE:-false}" = "true" ]; then args+=(--force); fi
          python backend/scripts/predict_season_faithful.py "${args[@]}"
